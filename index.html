<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="todoapp.css">
    <title>To Do App</title>
</head>
<body>
     <div class="container">
        <div class="stats-container">
            <div class="details">
                <h1>My Todo App</h1>
                <p>Track Your Progress</p>
                <div id="progressBar">
                    <div id="progress"></div>
                </div>
            </div>
                <div class="stats-number">
                    <p id="numbers">0 / 0</p>
            </div>

        </div>
        <form action="">
            <input type="text" id="taskInput" placeholder="write your task">
            <button type="submit" id="addButton">+</button>
        </form>

        <ul id="task-list"></ul>
     </div>

    <script src="todapp.js"></script>
</body>
</html>
